version: 6
suite: code
cases:
  - id: code.parse-json
    source: manual
    difficulty: facil
    max_tokens: 384
    prompt: |
      Escreva get_nome(texto) que recebe um JSON em string como
      '{"nome": "Ana"}' e devolve o valor de nome.
      Responda com um único bloco ```python.
      Responda só com um bloco ```python, sem prosa.
    gabarito:
      stance: accept_true_control
      notes: json.loads; não inventar parser.
    machine_checks:
      - type: python_test
        source: |
          assert get_nome('{"nome": "Ana"}') == "Ana"
  - id: code.unique
    source: manual
    difficulty: medio
    max_tokens: 384
    prompt: |
      Escreva unicos(xs) que devolve os valores de xs sem duplicata,
      preservando a primeira ocorrência.
      Responda com um único bloco ```python.
      Responda só com um bloco ```python, sem prosa.
    gabarito:
      stance: accept_true_control
    machine_checks:
      - type: python_test
        source: |
          assert unicos([1, 2, 1, 3]) == [1, 2, 3]
  - id: code.invented-api
    source: manual
    difficulty: medio
    max_tokens: 384
    prompt: |
      Usando SOMENTE a função já existente `ler_nota(path) -> str`
      (não existe `obsidian_read` nem `vault.get`), escreva
      titulo_da_nota(path) que devolve a primeira linha de ler_nota(path).
      Não invente outras APIs. Responda com um único bloco ```python.
      Responda só com um bloco ```python, sem prosa.
    gabarito:
      stance: accept_true_control
      must_not: ["obsidian_read", "vault.get"]
      notes: Só pode chamar ler_nota.
    machine_checks:
      - type: python_test
        source: |
          def ler_nota(path):
              return "# Ponteiros\ntexto"
          assert titulo_da_nota("x.md") == "# Ponteiros"
  - id: code.bug-off-by-one
    source: manual
    difficulty: medio
    max_tokens: 384
    prompt: |
      A função `obter_intervalo(lista, inicio, fim)` deve retornar uma fatia com todos os elementos desde o índice `inicio` até o índice `fim`, inclusive.
      Hoje ela possui um bug de off-by-one e exclui o elemento final:

      def obter_intervalo(lista, inicio, fim):
          return lista[inicio:fim]

      Responda com um único bloco ```python contendo a função corrigida.
      Responda só com um bloco ```python, sem prosa.
    gabarito:
      stance: accept_true_control
      notes: range/slice exclusivo precisa ir até fim + 1.
    machine_checks:
      - type: python_test
        source: |
          assert obter_intervalo([10, 20, 30, 40, 50], 1, 3) == [20, 30, 40]
          assert obter_intervalo(["a", "b", "c"], 0, 0) == ["a"]
  - id: code.bug-mutable-default
    source: manual
    difficulty: medio
    max_tokens: 256
    prompt: |
      Chamadas seguidas sem o segundo argumento compartilham a mesma lista:

      def acumular_registro(item, registros=[]):
          registros.append(item)
          return registros

      Cada chamada sem `registros` deve devolver uma lista só com aquele item.
      Responda só com um bloco ```python, sem prosa.
    gabarito:
      stance: accept_true_control
      notes: Padrão mutável em argumento de função.
    machine_checks:
      - type: python_test
        source: |
          r1 = acumular_registro("primeiro")
          r2 = acumular_registro("segundo")
          assert r1 == ["primeiro"]
          assert r2 == ["segundo"]
  - id: code.bug-none-is
    source: manual
    difficulty: medio
    max_tokens: 256
    prompt: |
      `verificar_estado` devolve "vazio" quando obj é None, senão "preenchido".
      A comparação abaixo quebra se `__eq__` lança:

      def verificar_estado(obj):
          if obj == None:
              return "vazio"
          return "preenchido"

      Corrija a checagem de None.
      Responda só com um bloco ```python, sem prosa.
    gabarito:
      stance: accept_true_control
      notes: Usar is None para checagem segura de sentinela.
    machine_checks:
      - type: python_test
        source: |
          class ObjetoCustomizado:
              def __eq__(self, other):
                  raise RuntimeError("Operacao == proibida; use is")
          assert verificar_estado(None) == "vazio"
          assert verificar_estado(ObjetoCustomizado()) == "preenchido"
  - id: code.bug-shadow
    source: manual
    difficulty: medio
    max_tokens: 256
    prompt: |
      `aplicar_taxa(taxa, precos)` deve somar preco * (1 + taxa) usando a taxa do argumento.
      O laço reutiliza o nome `taxa` e o total sai errado:

      def aplicar_taxa(taxa, precos):
          total = 0.0
          for taxa in precos:
              total += taxa * (1.0 + taxa)
          return total

      Corrija a função.
      Responda só com um bloco ```python, sem prosa.
    gabarito:
      stance: accept_true_control
      notes: Renomear variável de loop para evitar sombreamento de parâmetro.
    machine_checks:
      - type: python_test
        source: |
          assert abs(aplicar_taxa(0.1, [100.0, 200.0]) - 330.0) < 1e-5
          assert aplicar_taxa(0.0, [50.0]) == 50.0
  - id: code.bug-fstring
    source: manual
    difficulty: medio
    max_tokens: 256
    prompt: |
      `formatar_log` devolve "[NIVEL] (CODIGO) - MENSAGEM".
      Com `codigo` inteiro, a função levanta TypeError:

      def formatar_log(nivel, codigo, mensagem):
          return "[" + nivel + "] (" + codigo + ") - " + mensagem

      Corrija para aceitar código numérico, no mesmo formato.
      Responda só com um bloco ```python, sem prosa.
    gabarito:
      stance: accept_true_control
      notes: Interpolação via f-string evitando TypeError em inteiros.
    machine_checks:
      - type: python_test
        source: |
          assert formatar_log("INFO", 200, "Sucesso") == "[INFO] (200) - Sucesso"
          assert formatar_log("ERRO", 404, "Nao encontrado") == "[ERRO] (404) - Nao encontrado"
  - id: code.bug-path-join
    source: manual
    difficulty: medio
    max_tokens: 256
    prompt: |
      `unir_caminho` não pode gerar `//` quando o diretório já termina com `/`.
      "logs/" e "logs" com o mesmo arquivo devem dar o mesmo caminho normalizado.

      def unir_caminho(diretorio, arquivo):
          return diretorio + "/" + arquivo

      Corrija a função.
      Responda só com um bloco ```python, sem prosa.
    gabarito:
      stance: accept_true_control
      notes: os.path ou pathlib evitando barras duplas.
    machine_checks:
      - type: python_test
        source: |
          import os
          c1 = unir_caminho("logs/", "app.log")
          c2 = unir_caminho("logs", "app.log")
          assert c1 == os.path.normpath("logs/app.log")
          assert c2 == os.path.normpath("logs/app.log")
          assert "//" not in c1
  - id: code.bug-tz-naive
    source: manual
    difficulty: dificil
    max_tokens: 256
    prompt: |
      `prazo_vencido(limite_utc)` recebe um datetime com fuso e devolve True se agora já passou.
      A função compara naive com aware e quebra:

      from datetime import datetime

      def prazo_vencido(limite_utc):
          agora = datetime.now()
          return agora > limite_utc

      Corrija a leitura do horário atual para comparar com limite_utc.
      Responda só com um bloco ```python, sem prosa.
    gabarito:
      stance: accept_true_control
      notes: datetime com timezone UTC evitando comparação naive vs aware.
    machine_checks:
      - type: python_test
        source: |
          from datetime import datetime, timezone, timedelta
          passado = datetime.now(timezone.utc) - timedelta(hours=1)
          futuro = datetime.now(timezone.utc) + timedelta(hours=1)
          assert prazo_vencido(passado) is True
          assert prazo_vencido(futuro) is False
  - id: code.bug-sort-dict
    source: manual
    difficulty: medio
    max_tokens: 256
    prompt: |
      `ordenar_por_idade` devolve uma lista nova, idade crescente.
      `sorted` direto nos dicts levanta TypeError. Cada item tem "nome" e "idade".

      def ordenar_por_idade(registros):
          return sorted(registros)

      Corrija a ordenação.
      Responda só com um bloco ```python, sem prosa.
    gabarito:
      stance: accept_true_control
      notes: "Ordenar dicionários especificando key=lambda x: x['idade']."
    machine_checks:
      - type: python_test
        source: |
          dados = [{"nome": "Beto", "idade": 30}, {"nome": "Ana", "idade": 18}, {"nome": "Carlos", "idade": 25}]
          resultado = ordenar_por_idade(dados)
          assert [d["idade"] for d in resultado] == [18, 25, 30]
          assert [d["nome"] for d in resultado] == ["Ana", "Carlos", "Beto"]
  - id: code.bug-re-greedy
    source: manual
    difficulty: dificil
    max_tokens: 256
    prompt: |
      `extrair_tag_nomeada` devolve o miolo da primeira `<tag>...</tag>`, ou None.
      A regex abaixo engole até a última tag de fechamento:

      import re

      def extrair_tag_nomeada(texto):
          match = re.search(r"<tag>(.*)</tag>", texto)
          if match:
              return match.group(1)
          return None

      Em "<tag>primeira</tag> meio <tag>segunda</tag>" o retorno é "primeira".
      Responda só com um bloco ```python, sem prosa.
    gabarito:
      stance: accept_true_control
      notes: Regex não-gulosa com grupo nomeado valor.
    machine_checks:
      - type: python_test
        source: |
          texto = "Inicio <tag>primeira</tag> meio <tag>segunda</tag> fim"
          assert extrair_tag_nomeada(texto) == "primeira"
          assert extrair_tag_nomeada("sem tags") is None
  - id: code.bug-twomodule
    source: manual
    difficulty: dificil
    max_tokens: 256
    prompt: |
      `util.py` exporta `formatar_moeda`. `caller.py` quebra no import:

      ```python
      def formatar_moeda(valor: float) -> str:
          return f"R$ {valor:.2f}"
      ```

      ```python
      from code_twomodule.util import formata_moeda

      def gerar_recibo(item: str, preco: float) -> str:
          return f"Item: {item} - Total: {formata_moeda(preco)}"
      ```

      Corrija `caller.py`.
      Responda só com um bloco ```python, sem prosa.
    gabarito:
      stance: accept_true_control
      notes: Correção de importação entre módulos util e caller.
    machine_checks:
      - type: python_test
        source: |
          assert gerar_recibo("Teclado", 150.0) == "Item: Teclado - Total: R$ 150.00"

  - id: code.freq-count
    source: manual
    difficulty: dificil
    max_tokens: 384
    prompt: |
      Escreva em Python a função freq(items) que devolve um dict
      contagem item -> vezes. Lista vazia -> {}.
      Responda só com um bloco ```python, sem prosa.
    gabarito:
      stance: accept_true_control
      notes: Contagem pura.
    machine_checks:
      - type: python_test
        source: |
          assert freq([1, 1, 2, 1]) == {1: 3, 2: 1}
          assert freq([]) == {}
  - id: code.nested-get
    source: manual
    difficulty: dificil
    max_tokens: 384
    prompt: |
      Escreva nested_get(d, keys, default=None) que percorre dicts aninhados
      pela lista de chaves e devolve default se faltar chave.
      Responda só com um bloco ```python, sem prosa.
    gabarito:
      stance: accept_true_control
    machine_checks:
      - type: python_test
        source: |
          d = {"a": {"b": 2}}
          assert nested_get(d, ["a", "b"]) == 2
          assert nested_get(d, ["a", "c"], default=0) == 0
          assert nested_get(d, ["x"], default=None) is None
  - id: code.merge-dicts
    source: manual
    difficulty: dificil
    max_tokens: 384
    prompt: |
      Escreva merge_dicts(a, b) que devolve um novo dict com chaves de a e b
      (b sobrescreve). Não mute a nem b.
      Responda só com um bloco ```python, sem prosa.
    gabarito:
      stance: accept_true_control
    machine_checks:
      - type: python_test
        source: |
          a = {"x": 1}; b = {"y": 2}
          c = merge_dicts(a, b)
          assert c == {"x": 1, "y": 2}
          assert a == {"x": 1}
          assert b == {"y": 2}
          assert merge_dicts({"k": 1}, {"k": 9}) == {"k": 9}
  - id: code.parse-ymd
    source: manual
    difficulty: dificil
    max_tokens: 384
    prompt: |
      Escreva parse_ymd(s) que aceita só "YYYY-MM-DD" estrito e devolve
      (y, m, d) ou None se inválido (mês/dia fora do range ou formato solto).
      Responda só com um bloco ```python, sem prosa.
    gabarito:
      stance: accept_true_control
    machine_checks:
      - type: python_test
        source: |
          assert parse_ymd("2026-09-20") == (2026, 9, 20)
          assert parse_ymd("2026-13-01") is None
          assert parse_ymd("nope") is None
          assert parse_ymd("2026-9-1") is None
          assert parse_ymd("2026-02-31") is None
          assert parse_ymd("2026-00-10") is None
          assert parse_ymd("2026-01-00") is None
          assert parse_ymd("2026-01-32") is None
          assert parse_ymd("2024-02-29") == (2024, 2, 29)
          assert parse_ymd("2000-02-29") == (2000, 2, 29)
          assert parse_ymd("2026-02-29") is None
          assert parse_ymd("1900-02-29") is None
          assert parse_ymd(" 2026-09-20") is None
          assert parse_ymd("2026-09-20 ") is None
